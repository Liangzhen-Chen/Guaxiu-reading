name: Deploy to ECS

on:
  push:
    tags:
      - 'v*'          # 打 tag v4.0.3 等自动部署
  workflow_dispatch:   # 支持手动触发
    inputs:
      target:
        description: '部署目标'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/xiugua_ecs
          chmod 600 ~/.ssh/xiugua_ecs
          ssh-keyscan -H 122.51.236.219 >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          bash deploy.sh ${{ github.event.inputs.target || 'production' }}

      - name: Health Check
        run: |
          sleep 3
          curl -s https://xiugua-reading.cn/health | grep '"ok"'
